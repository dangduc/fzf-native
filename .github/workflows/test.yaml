name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main", "develop"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
        emacs-version:
          - 30.1
          - snapshot
    steps:
      - uses: actions/checkout@v2

      - uses: jcs090218/setup-emacs@master
        if: matrix.os != 'macos-15-intel'
        with:
          version: ${{ matrix.emacs-version }}

      # Current nix-emacs-ci follows Nixpkgs 26.11, which dropped x86_64
      # Darwin.  Keep Intel CI on the immutable 30.2-era lock instead of
      # silently removing that architecture from the matrix.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        if: matrix.os == 'macos-15-intel'

      - name: Install Emacs on Intel macOS
        if: matrix.os == 'macos-15-intel'
        shell: bash
        env:
          EMACS_VERSION: ${{ matrix.emacs-version }}
        run: |
          package="emacs-${EMACS_VERSION//./-}"
          nix profile install --accept-flake-config \
            "github:purcell/nix-emacs-ci/b12b5b31e40df750478c9fc68c1e81c91ed079ec#${package}"

      - uses: actions/setup-node@v2
        with:
          node-version: '16'

      - uses: emacs-eask/setup-eask@master
        with:
          version: 'snapshot'

      - name: Print emacs version
        run: |
          emacs --version

      - run: echo "$HOME/.cask/bin" >> $GITHUB_PATH
      - run: make check-version
      - run: make compile
      - run: make lint
      - run: make ctest
        if: runner.os != 'Windows'
      - name: ASan/UBSan C unit tests
        run: make ctest-asan
        if: runner.os != 'Windows'

      - name: Clean stale binaries
        shell: bash
        run: rm -rf bin
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build native module
        run: cmake --build build --config Release

      - run: make test
