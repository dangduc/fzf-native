name: Build And Publish Binaries

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Commit binaries and bump the package version
        required: false
        default: false
        type: boolean
      rebuild:
        description: Build replacement binaries without committing them
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "**.c"
      - "**.h"
      - "fzf-native.el"
      - "fzf-native-module.def"
      - "fzf-native-module.map"
      - "CMakeLists.txt"
      - ".github/workflows/cmake-binaries.yaml"
  push:
    branches: ["main"]
    paths:
      - "**.c"
      - "**.h"
      - "fzf-native.el"
      - "fzf-native-module.def"
      - "fzf-native-module.map"
      - "CMakeLists.txt"
      - ".github/workflows/cmake-binaries.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: macos-arm64
            cmake_args: -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - os: macos-15-intel
            artifact: macos-x86_64
            cmake_args: -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - os: windows-latest
            artifact: windows-x86_64
            cmake_args: ""

    steps:
    - uses: actions/checkout@v4

    # nix-emacs-ci's current Nixpkgs no longer evaluates x86_64 Darwin.
    # Install Nix with an immutable action, then select the last locked
    # nix-emacs-ci revision that provides Emacs 30.2 on both Darwin arches.
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      if: runner.os != 'Windows'

    - name: Install Emacs 30.2 on POSIX
      if: runner.os != 'Windows'
      shell: bash
      run: >-
        nix profile install --accept-flake-config
        github:purcell/nix-emacs-ci/b12b5b31e40df750478c9fc68c1e81c91ed079ec#emacs-30-2

    - uses: jcs090218/setup-emacs-windows@3ad415b5f6575fe0bb8218cb35c199a93b1fb833
      if: runner.os == 'Windows'
      with:
        version: 30.2

    - name: Smoke tracked artifact before rebuilding
      if: >-
        github.event_name != 'workflow_dispatch' ||
        (inputs.publish != true && inputs.rebuild != true)
      shell: bash
      run: |
        emacs -Q --batch -L . -l fzf-native \
          -f fzf-native-load-dyn \
          --eval "(let ((fzf-native-case-mode 'ignore)) (unless (> (car (fzf-native-score \"k\" (string #x212A))) 0) (error \"tracked UTF-8 artifact is stale\")))"

    - name: Clean stale binaries
      shell: bash
      run: rm -rf bin

    - name: Configure CMake
      run: >-
        cmake -B ${{github.workspace}}/build
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        ${{matrix.cmake_args}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --verbose --config ${{env.BUILD_TYPE}}

    - name: Smoke fresh artifact
      shell: bash
      run: |
        emacs -Q --batch -L . -l fzf-native \
          -f fzf-native-load-dyn \
          --eval "(let ((fzf-native-case-mode 'ignore)) (unless (> (car (fzf-native-score \"k\" (string #x212A))) 0) (error \"fresh UTF-8 artifact failed\")))"

    - name: Check Darwin export surface
      if: runner.os == 'macOS'
      shell: bash
      run: |
        module=$(find bin -type f -name 'fzf-native-module.so' -print -quit)
        actual=$(nm -gU "$module" | awk '{print $3}' | sort)
        expected=$(printf '%s\n' _emacs_module_init _plugin_is_GPL_compatible | sort)
        test "$actual" = "$expected"
        minos=$(otool -l "$module" | awk '$1 == "minos" {print $2; exit}')
        printf 'minimum macOS version: %s\n' "$minos"
        test "$minos" = 11.0

    - name: Check Windows export surface
      if: runner.os == 'Windows'
      shell: bash
      run: |
        actual=$(llvm-readobj --coff-exports bin/Windows/Release/fzf-native-module.dll | awk '$1 == "Name:" {print $2}' | sort)
        expected=$(printf '%s\n' emacs_module_init plugin_is_GPL_compatible | sort)
        printf 'defined DLL exports:\n%s\n' "$actual"
        test "$actual" = "$expected"

    - name: Smoke interactive session ABI
      if: runner.os != 'Windows'
      shell: bash
      run: |
        emacs -Q --batch -L . -l fzf-native \
          -f fzf-native-load-dyn -l ert -l fzf-native-test.el \
          --eval '(ert-run-tests-batch-and-exit "^fzf-native-async-submit-snapshot-lifecycle-test$")'

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: bin-${{ matrix.artifact }}
        path: bin/
        if-no-files-found: error
        retention-days: 1

  build-linux:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
    - name: Install build tools
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt-get update
        apt-get install -y build-essential ca-certificates git python3-pip
        pip3 install --no-cache-dir cmake==3.31.6

    - uses: actions/checkout@v4

    - name: Clean stale binaries
      run: rm -rf bin

    - name: Configure and build on glibc 2.31
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
        cmake --build build --verbose --config ${BUILD_TYPE}

    - name: Check Linux compatibility and export surface
      shell: bash
      run: |
        module=bin/Linux/fzf-native-module.so
        max_glibc=$(objdump -T "$module" | grep -o 'GLIBC_[0-9.]*' | cut -d_ -f2 | sort -V | tail -1)
        test -n "$max_glibc"
        echo "maximum required glibc version: $max_glibc"
        test "$(printf '%s\n' "$max_glibc" 2.31 | sort -V | tail -1)" = 2.31
        actual=$(nm -D --defined-only "$module" | awk '{print $3}' | sort)
        expected=$(printf '%s\n' emacs_module_init plugin_is_GPL_compatible | sort)
        printf 'defined dynamic symbols:\n%s\n' "$actual"
        test "$actual" = "$expected"

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: bin-ubuntu-x86_64
        path: bin/
        if-no-files-found: error
        retention-days: 1

  smoke-linux:
    needs: build-linux
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24

    - name: Install Emacs 30.2
      run: >-
        nix profile install --accept-flake-config
        github:purcell/nix-emacs-ci/b12b5b31e40df750478c9fc68c1e81c91ed079ec#emacs-30-2

    - name: Smoke tracked Linux artifact
      if: >-
        github.event_name != 'workflow_dispatch' ||
        (inputs.publish != true && inputs.rebuild != true)
      run: |
        emacs -Q --batch -L . -l fzf-native \
          -f fzf-native-load-dyn \
          --eval "(let ((fzf-native-case-mode 'ignore)) (unless (> (car (fzf-native-score \"k\" (string #x212A))) 0) (error \"tracked UTF-8 artifact is stale\")))"

    - uses: actions/download-artifact@v4
      with:
        name: bin-ubuntu-x86_64
        path: fresh-bin

    - name: Smoke fresh Linux artifact
      run: |
        FZF_NATIVE_TEST_MODULE=${{github.workspace}}/fresh-bin/Linux/fzf-native-module.so \
          emacs -Q --batch -L . -l ert -l fzf-native-test.el \
          -l fzf-native-utf8-test.el \
          --eval "(ert-run-tests-batch-and-exit \
            '(or fzf-native-async-submit-snapshot-lifecycle-test \
                 fzf-native-utf8-case-ignore-length-changing-fold-test))"

  build-freebsd:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build and smoke in FreeBSD VM
      uses: vmactions/freebsd-vm@v1
      with:
        release: "14.4"
        usesh: true
        prepare: |
          pkg install -y cmake emacs-nox
        run: |
          freebsd-version -u | grep -q '^14\.4'
          if [ "${{ github.event_name }}" != workflow_dispatch ] || \
             { [ "${{ inputs.publish }}" != true ] && [ "${{ inputs.rebuild }}" != true ]; }; then
            emacs -Q --batch -L . -l fzf-native \
              -f fzf-native-load-dyn \
              --eval "(let ((fzf-native-case-mode 'ignore)) (unless (> (car (fzf-native-score \"k\" (string #x212A))) 0) (error \"tracked UTF-8 artifact is stale\")))"
          fi
          rm -rf bin
          cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          cmake --build build --verbose --config ${{ env.BUILD_TYPE }}
          emacs -Q --batch -L . -l fzf-native \
            -f fzf-native-load-dyn \
            --eval "(let ((fzf-native-case-mode 'ignore)) (unless (> (car (fzf-native-score \"k\" (string #x212A))) 0) (error \"fresh UTF-8 artifact failed\")))"
          actual=$(nm -D --defined-only -P bin/FreeBSD/fzf-native-module.so | awk '{print $1}' | sort)
          expected=$(printf '%s\n' emacs_module_init plugin_is_GPL_compatible | sort)
          printf 'defined dynamic symbols:\n%s\n' "$actual"
          test "$actual" = "$expected"
          emacs -Q --batch -L . -l fzf-native \
            -f fzf-native-load-dyn -l ert -l fzf-native-test.el \
            --eval '(ert-run-tests-batch-and-exit "^fzf-native-async-submit-snapshot-lifecycle-test$")'

    # The VM action can leave the checkout's other tracked binaries in bin/.
    # Publish only the file that this job built.
    - name: Stage FreeBSD binary
      run: |
        rm -rf artifact-bin
        mkdir -p artifact-bin/FreeBSD
        cp bin/FreeBSD/fzf-native-module.so artifact-bin/FreeBSD/

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: bin-freebsd-x86_64
        path: artifact-bin/
        if-no-files-found: error
        retention-days: 1

  commit:
    if: github.event_name == 'push' || inputs.publish == true
    needs: [build, build-linux, smoke-linux, build-freebsd]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Download all binaries
      uses: actions/download-artifact@v4
      with:
        path: bin-artifacts
        pattern: bin-*

    - name: Stage binaries
      run: |
        rm -rf bin
        mkdir -p bin/Darwin/arm64 bin/FreeBSD bin/Linux bin/Windows/Release
        cp bin-artifacts/bin-macos-x86_64/Darwin/fzf-native-module.so bin/Darwin/
        cp bin-artifacts/bin-macos-arm64/Darwin/arm64/fzf-native-module.so bin/Darwin/arm64/
        cp bin-artifacts/bin-freebsd-x86_64/FreeBSD/fzf-native-module.so bin/FreeBSD/
        cp bin-artifacts/bin-ubuntu-x86_64/Linux/fzf-native-module.so bin/Linux/
        cp bin-artifacts/bin-windows-x86_64/Windows/Release/fzf-native-module.dll bin/Windows/Release/
        cp bin-artifacts/bin-windows-x86_64/Windows/Release/fzf-native-module.exp bin/Windows/Release/
        cp bin-artifacts/bin-windows-x86_64/Windows/Release/fzf-native-module.lib bin/Windows/Release/
        rm -rf bin-artifacts
        test -f bin/Linux/fzf-native-module.so
        test -f bin/FreeBSD/fzf-native-module.so
        test -f bin/Darwin/fzf-native-module.so
        test -f bin/Darwin/arm64/fzf-native-module.so
        test -f bin/Windows/Release/fzf-native-module.dll

    - name: Bump version
      id: bump
      run: |
        current=$(grep -E '^;; Version: ' fzf-native.el | sed -E 's/^;; Version: //')
        eask_current=$(sed -n -E 's/^[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' Eask | head -1)
        if [ -z "$current" ] || [ "$current" != "$eask_current" ]; then
          echo "Version mismatch before bump: fzf-native.el=$current Eask=$eask_current" >&2
          exit 1
        fi
        major=$(echo "$current" | cut -d. -f1)
        minor=$(echo "$current" | cut -d. -f2)
        minor=$((minor + 1))
        if [ "$minor" -ge 10 ]; then
          major=$((major + 1))
          minor=0
        fi
        new="${major}.${minor}"
        remote_tag=$(git ls-remote --tags origin "refs/tags/${new}") || {
          echo "Could not check whether release tag ${new} exists" >&2
          exit 1
        }
        if [ -n "$remote_tag" ]; then
          echo "Release tag ${new} already exists; update the declared version before publishing" >&2
          exit 1
        fi
        sed -i "s/^;; Version: ${current}$/;; Version: ${new}/" fzf-native.el
        sed -i -E "s/^([[:space:]]+)\"${current}\"$/\1\"${new}\"/" Eask
        echo "version=${new}" >> "$GITHUB_OUTPUT"
        echo "Bumped $current -> $new"

    - name: Stage generated release
      run: |
        git add --all -- bin fzf-native.el Eask
        git diff --cached --name-status

    - name: Commit changes
      uses: EndBug/add-and-commit@v9
      with:
        author_name: github-actions
        author_email: github-actions@github.com
        message: Update binaries for all platforms
        add: |
          bin/**
          fzf-native.el
          Eask
        tag: ${{ steps.bump.outputs.version }}
